# Sammelt jeden Morgen die Radar-Daten (News, Google Trends, Hashtags, Kartenpreise) und speichert sie in data/radar.json.
# Zwei weitere Läufe am Tag holen nur Google Trends nach, was im Hauptlauf gesperrt war (jeder Lauf hat meist eine andere IP).
# Manuell starten: Actions → „Radar-Daten sammeln“ → Run workflow.
name: Radar-Daten sammeln

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '47 10 * * *'
    - cron: '47 16 * * *'
  workflow_dispatch:
    inputs:
      nur_trends:
        description: 'Nur Google Trends nachholen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten sammeln
        run: node scripts/collect.mjs
        env:
          # für die GitHub-Suche (Entwickler-Interesse): höheres Abruflimit als ohne Anmeldung
          GITHUB_TOKEN: ${{ github.token }}
          # Kontakt-E-Mail für die SEC-Volltextsuche (verlangt die SEC); als Secret, damit sie nicht öffentlich im Code steht.
          # Ohne das Secret überspringt der Sammler die SEC.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          # Nachmittags- und Abendlauf: nur Google Trends
          TRENDS_ONLY: ${{ github.event.schedule == '47 10 * * *' || github.event.schedule == '47 16 * * *' || inputs.nur_trends == true }}
      - name: Speichern
        run: |
          git config user.name 'smartwin-sammler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Radar-Daten $(date -u +%F)"
          # Hat ein anderer Lauf die Datei inzwischen geändert, gewinnen die gerade gesammelten Daten
          git pull --rebase -X theirs origin main
          git push
